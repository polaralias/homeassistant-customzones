name: CI

on:
  pull_request:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_test.txt

      - name: Run Ruff
        run: python -m ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            ha: "2025.1.4"
            plugin: "pytest-homeassistant-custom-component==0.13.205"
          - python: "3.14"
            ha: "2026.10.4"
            plugin: "pytest-homeassistant-custom-component"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --pre "homeassistant==${{ matrix.ha }}" "${{ matrix.plugin }}"
      - name: Run pytest
        run: python -m pytest
